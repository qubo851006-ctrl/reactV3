name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Production deps + test deps (pytest lives in requirements-dev.txt).
          pip install -r requirements.txt -r requirements-dev.txt
          # CI-only display helper: turns pytest failures into GitHub
          # annotations. Not a test dependency, so it stays out of
          # requirements-dev.txt and is installed only here.
          pip install pytest-github-actions-annotate-failures

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .

      - name: Run pytest
        working-directory: backend
        # No real credentials needed: every test mocks the LLM client and the
        # alembic env.py falls back to SQLite when APP_DATABASE_URL is unset.
        # -v gives one line per test so CI failures are diagnosable from the
        # public-anonymous API (annotations don't include log content).
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python -m pytest tests/ -v --tb=long -ra

  security-audit:
    name: Dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip-audit (backend production deps)
        working-directory: backend
        # Audits the pinned production requirements against the PyPI / OSV
        # advisory DB. Dev-only tools (pytest/ruff) don't ship to production,
        # so only requirements.txt is checked here.
        #
        # REPORT-ONLY (continue-on-error): when first adopting the scanner the
        # repo already carries a pre-existing CVE backlog (e.g. pillow needs a
        # major bump; some are transitive). We don't want that backlog to keep
        # master permanently red (which trains people to ignore the signal),
        # and major bumps need deliberate testing — so findings are printed to
        # the job log + Dependabot opens fix PRs, but the build isn't failed.
        # BEFORE LAUNCH: burn down the backlog, then drop `continue-on-error`
        # here (and on the npm step) to turn this into a hard gate.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner=off

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend production deps)
        working-directory: frontend
        # Production deps only, high/critical. Dev deps (vite/vitest/eslint)
        # never ship to the browser, so they're excluded to avoid noise from
        # build-toolchain advisories. Report-only for now (see pip-audit note
        # above); currently clean (0 prod vulns), so this passes regardless.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (vitest)
        working-directory: frontend
        env:
          TZ: Asia/Shanghai  # match local dev so date/locale-sensitive tests don't flake
        run: npm run test -- --reporter=verbose

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
