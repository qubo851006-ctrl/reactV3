name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CI-only helper: surface pytest failures as GitHub annotations
          pip install pytest pytest-github-actions-annotate-failures

      - name: Run pytest
        working-directory: backend
        # No real credentials needed: every test mocks the LLM client and the
        # alembic env.py falls back to SQLite when APP_DATABASE_URL is unset.
        # -v gives one line per test so CI failures are diagnosable from the
        # public-anonymous API (annotations don't include log content).
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python -m pytest tests/ -v --tb=long -ra

  frontend:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (vitest)
        working-directory: frontend
        env:
          TZ: Asia/Shanghai  # match local dev so date/locale-sensitive tests don't flake
        run: npm run test -- --reporter=verbose

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
