# Dependabot —— 依赖漏洞与过时自动巡检（v3.6.19）
#
# 每周对三个生态各开一次"有更新/有漏洞"的 PR：
#   - pip       后端 Python 依赖（backend/requirements*.txt）
#   - npm       前端 Node 依赖（frontend/package.json + lock）
#   - github-actions  CI 用到的 action 版本
#
# PR 会带上 changelog / 兼容性信息，合并前仍走 CI 四门禁（ruff+pytest+
# lint+vitest+build）把关，不会绕过测试。安全类更新（security advisory）
# Dependabot 会优先单独开 PR、并打 security 标签。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      # 把非安全的小版本升级合并成一个 PR，减少噪音；安全更新仍单独开。
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
